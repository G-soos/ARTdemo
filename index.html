<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ART digital</title>
  <meta name="description" content="Análisis de Riesgos de la Tarea (ART) digital: llena, firma y genera el PDF oficial desde el celular, incluso sin señal.">
  <meta name="theme-color" content="#00788a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <!-- Librerías locales (vendor/) para que la app funcione sin conexión en faena -->
  <script src="vendor/pdf-lib.min.js" defer></script>
  <script src="vendor/html5-qrcode.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"><p class="cargando">Cargando…</p></div>
  <script>
    // Abierto con doble clic (file://): el navegador bloquea los módulos y la app no puede arrancar.
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<div style="max-width:560px;margin:40px auto;padding:24px;background:#fff;border-radius:12px;font-family:system-ui;line-height:1.5">' +
        '<h2 style="color:#00788a;margin-top:0">Abre la app desde un servidor</h2>' +
        '<p>Abriste el archivo directamente (file://). Por seguridad, el navegador no deja cargar la app ni la cámara así.</p>' +
        '<p><b>En Windows:</b> haz doble clic en <code>abrir-app.bat</code> (en esta misma carpeta).</p>' +
        '<p><b>O en una terminal</b> dentro de la carpeta:<br><code>python -m http.server 8765</code><br>y abre <a href="http://localhost:8765">http://localhost:8765</a></p>' +
        '<p>En el celular úsala desde GitHub Pages (https).</p></div>';
    }
  </script>
</body>
</html>
